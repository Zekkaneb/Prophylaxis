<!doctype html>
<html lang="en" data-theme="dark" data-accent="gold">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121214" id="theme-color" />
    <title>Prophylaxis — Repertoire &amp; tactics trainer</title>
    <script>
      /* Resolve the saved theme before first paint so the page never flashes
         the wrong ground. Mirrors readAppearance() in ThemeProvider. */
      (function () {
        var root = document.documentElement;
        try {
          var raw = localStorage.getItem('chess-trainer.appearance.v1');
          var saved = raw ? JSON.parse(raw) : {};
          var mode = saved.mode === 'light' || saved.mode === 'system' ? saved.mode : 'dark';
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          root.dataset.theme = mode;
          if (['gold', 'sage', 'azure', 'rose'].indexOf(saved.accent) >= 0) {
            root.dataset.accent = saved.accent;
          }
          root.style.colorScheme = mode;
        } catch (error) {
          root.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..800;1,6..12,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
